[package]
name = "s-dict"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A dynamic, incrementally mutable bidirectional RDF term <-> TermId dictionary, built from macro-dynamic lexical blocks over micro-static per-block indexes."

[features]
# `PackedAutomatonDictionary::map`: load a saved dictionary by memory-mapping
# it (records borrowed from the mapping, copied out per block on write).
mmap = ["dep:memmap2"]

[dependencies]
memmap2 = { version = "0.9", optional = true }

[profile.release]
lto = "thin"

# Release plus debug info, for `perf record`/`perf annotate` with source
# lines. Doesn't touch `[profile.release]`.
[profile.profiling]
inherits = "release"
debug = true
strip = false
